<!DOCTYPE html>

<meta charset="UTF-8">
<title>Picture Gallery - Bhagbat Computer Centre</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial;
  background:#f5f7fb;
  margin:0;
}

h2 {
  text-align:center;
  padding:20px;
  color:#123c8a;
}

.gallery {
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(250px,1fr));
  gap:15px;
  padding:20px;
}

.gallery img {
  width:100%;
  height:200px;
  object-fit:cover;
  border-radius:10px;
  box-shadow:0 4px 8px rgba(0,0,0,0.2);
  transition:0.3s;
}

.gallery img:hover {
  transform:scale(1.05);
}
</style>
</head>

<body>

}

@media(max-width:768px){

}
}
</style>
