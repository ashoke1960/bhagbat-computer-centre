<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class III Chapter 1 MCQ</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f8ff;
margin:0;
padding:0;
}

header{
background:linear-gradient(90deg,#123c8a,#0b1c3d);
color:white;
text-align:center;
padding:25px;
}

.container{
max-width:950px;
margin:auto;
padding:30px 20px;
}

.box{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
margin-bottom:20px;
}

h3{
color:#123c8a;
margin-bottom:12px;
}

label{
display:block;
margin:8px 0;
}

button{
padding:12px 20px;
background:gold;
border:none;
font-weight:bold;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#123c8a;
color:white;
}

.center{
text-align:center;
margin-top:20px;
}

#result{
font-size:24px;
font-weight:bold;
text-align:center;
margin-top:25px;
color:green;
}

.back{
text-align:center;
margin-top:20px;
}

.back a{
text-decoration:none;
background:#25D366;
color:white;
padding:10px 18px;
border-radius:8px;
font-weight:bold;
}
</style>
</head>

<body>

<header>
<h1>Class III MCQ Test</h1>
<p>Chapter 1 - How a Computer Works</p>
</header>

<div class="container">

<form id="quizForm">

<div class="box">
<h3>1. A computer is a ______ machine.</h3>
<label><input type="radio" name="q1" value="electronic"> Electronic</label>
<label><input type="radio" name="q1" value="wooden"> Wooden</label>
<label><input type="radio" name="q1" value="paper"> Paper</label>
</div>

<div class="box">
<h3>2. IPO means Input, Process and ______</h3>
<label><input type="radio" name="q2" value="Output"> Output</label>
<label><input type="radio" name="q2" value="Open"> Open</label>
<label><input type="radio" name="q2" value="Office"> Office</label>
</div>

<div class="box">
<h3>3. Which is hardware?</h3>
<label><input type="radio" name="q3" value="Keyboard"> Keyboard</label>
<label><input type="radio" name="q3" value="Paint"> Paint</label>
<label><input type="radio" name="q3" value="WordPad"> WordPad</label>
</div>

<div class="box">
<h3>4. Which is software?</h3>
<label><input type="radio" name="q4" value="MS Word"> MS Word</label>
<label><input type="radio" name="q4" value="Mouse"> Mouse</label>
<label><input type="radio" name="q4" value="Monitor"> Monitor</label>
</div>

<div class="box">
<h3>5. Output is shown on ______</h3>
<label><input type="radio" name="q5" value="Monitor"> Monitor</label>
<label><input type="radio" name="q5" value="Keyboard"> Keyboard</label>
<label><input type="radio" name="q5" value="CPU Box"> CPU Box</label>
</div>

<div class="center">
<button type="button" onclick="checkAnswers()">Submit Test</button>
</div>

</form>

<div id="result"></div>

<div class="back">
<a href="class3.html">⬅ Back to Class III</a>
</div>

</div>

<script>
function checkAnswers(){

let score = 0;

if(document.querySelector('input[name="q1"]:checked')?.value=="electronic") score++;
if(document.querySelector('input[name="q2"]:checked')?.value=="Output") score++;
if(document.querySelector('input[name="q3"]:checked')?.value=="Keyboard") score++;
if(document.querySelector('input[name="q4"]:checked')?.value=="MS Word") score++;
if(document.querySelector('input[name="q5"]:checked')?.value=="Monitor") score++;

document.getElementById("result").innerHTML =
"Your Score: " + score + " / 5";

}
</script>

</body>
</html>
