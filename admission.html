<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Online Admission - Bhagbat Computer Centre</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial;
  background:#f2f6ff;
  margin:0;
}

.container {
  max-width:600px;
  margin:40px auto;
  background:white;
  padding:25px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2 {
  text-align:center;
  color:#123c8a;
}

input, select, textarea {
  width:100%;
  padding:10px;
  margin:10px 0;
  border:1px solid #ccc;
  border-radius:6px;
}

button {
  width:100%;
  padding:12px;
  background:#123c8a;
  color:white;
  border:none;
  border-radius:6px;
  font-size:16px;
}

button:hover {
  background:#0b1c3d;
}
</style>
</head>

<body>

<!-- PREMIUM UNIVERSAL MENU START -->

<style>
.premium-menu{
position:sticky;
top:0;
z-index:99999;
background:linear-gradient(90deg,#0f172a,#1e3a8a,#2563eb);
padding:10px;
text-align:center;
box-shadow:0 4px 10px rgba(0,0,0,.15);
}

.premium-menu a{
color:white;
text-decoration:none;
display:inline-block;
padding:10px 14px;
margin:3px;
font-size:15px;
font-weight:bold;
border-radius:8px;
transition:.3s;
}

.premium-menu a:hover{
background:gold;
color:black;
transform:translateY(-2px);
}

@media(max-width:768px){
.premium-menu a{
display:block;
margin:5px 0;
}
}
</style>

<div class="premium-menu">

<a href="admission.html">Admission</a>
</div>

<div class="container">
  <h2>Online Admission Form</h2>

  <form>
    <label>Full Name:</label>
    <input type="text" required>

    <label>Mobile Number:</label>
    <input type="tel" required>

    <label>Email:</label>
    <input type="email">

    <label>Select Course:</label>
    <select>
      <option>Basic Computer</option>
      <option>Advanced Computer</option>
      <option>Programming</option>
      <option>Typing Practice</option>
<option>Internet Skills</option>
<option>Computer for School Students</option>
    </select>

    <label>Address:</label>
    <textarea></textarea>

    <button type="submit">Submit Application</button>
  </form>
</div>

</body>
</html>
